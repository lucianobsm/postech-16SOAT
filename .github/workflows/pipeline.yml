name: Java CI/CD Pipeline

on:
  push:
    branches: [ "feature/**", "main" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch: {}

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: tech-challenge-backend
  EKS_CLUSTER_NAME: eks-tech-challenge
  K8S_NAMESPACE: tech-challenge
  K8S_DEPLOYMENT: tech-challenge-app
  K8S_CONTAINER: app

jobs:
  # JOB 1: ETAPA DE BUILD (COMPILAÇÃO)
  build:
    name: Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./tech-challenge-backend

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: 'tech-challenge-backend/pom.xml'

      - name: Dar permissão ao Maven Wrapper
        run: chmod +x mvnw

      - name: Compilar Aplicação e Gerar Pacote (sem rodar testes)
        run: ./mvnw clean package -DskipTests -B

      - name: Upload dos artefatos de build
        uses: actions/upload-artifact@v4
        with:
          name: target-build
          path: tech-challenge-backend/target/

  # JOB 2: TESTES UNITÁRIOS
  test:
    name: Testes Unitários
    runs-on: ubuntu-latest
    needs: build

    defaults:
      run:
        working-directory: ./tech-challenge-backend

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: 'tech-challenge-backend/pom.xml'

      - name: Dar permissão ao Maven Wrapper
        run: chmod +x mvnw

      - name: Download dos artefatos de build
        uses: actions/download-artifact@v4
        with:
          name: target-build
          path: tech-challenge-backend/target/

      - name: Executar Testes Unitários
        run: ./mvnw test -Dtest='!CucumberRunnerTest,!*IT' -B

      - name: Gerar Relatório JaCoCo (Unitários)
        if: always()
        run: ./mvnw jacoco:report -B

      - name: Upload do Relatório JaCoCo (Unitários)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-unit
          path: tech-challenge-backend/target/site/jacoco/

      - name: Upload de Relatórios de Falha (Surefire)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: tech-challenge-backend/target/surefire-reports/

  # JOB 3: TESTES DE INTEGRAÇÃO
  integration-test:
    name: Testes de Integração
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20

    defaults:
      run:
        working-directory: ./tech-challenge-backend

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: 'tech-challenge-backend/pom.xml'

      - name: Dar permissão ao Maven Wrapper
        run: chmod +x mvnw

      - name: Download dos artefatos de build
        uses: actions/download-artifact@v4
        with:
          name: target-build
          path: tech-challenge-backend/target/

      - name: Executar Testes de Integração (Failsafe)
        run: ./mvnw verify -Pintegration-tests -Dsurefire.skip=true -B

      - name: Upload do Relatório JaCoCo (Integração)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-integration
          path: tech-challenge-backend/target/site/jacoco/

      - name: Upload de Relatórios de Falha (Failsafe)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports
          path: tech-challenge-backend/target/failsafe-reports/

  # JOB 4: BUILD E PUSH DA IMAGEM PARA O ECR
  build-and-push-image:
    name: Build & Push (ECR)
    runs-on: ubuntu-latest
    needs: [ test, integration-test ]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')

    outputs:
      image: ${{ steps.build-image.outputs.image }}

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag e Push da Imagem Docker
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        working-directory: ./tech-challenge-backend
        run: |
          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  # JOB 5: DEPLOY NO CLUSTER KUBERNETES (EKS)
  deploy:
    name: Deploy (EKS)
    runs-on: ubuntu-latest
    needs: build-and-push-image
    environment: production

    steps:
      - name: Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Atualizar kubeconfig do Cluster EKS
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"

      - name: Atualizar Imagem do Deployment
        run: |
          kubectl -n "$K8S_NAMESPACE" set image \
            "deployment/$K8S_DEPLOYMENT" "$K8S_CONTAINER=${{ needs.build-and-push-image.outputs.image }}"

      - name: Aguardar Rollout
        run: kubectl -n "$K8S_NAMESPACE" rollout status "deployment/$K8S_DEPLOYMENT" --timeout=300s
