name: Terraform Infra (VPC/EKS/ECR/K8s)

on:
  push:
    branches: [ "main" ]
    paths:
      - "tech-challenge-backend/infra/**"
      - "tech-challenge-backend/k8s/**"
  pull_request:
    branches: [ "main"]
    paths:
      - "tech-challenge-backend/infra/**"
      - "tech-challenge-backend/k8s/**"
  workflow_dispatch:
    inputs:
      action:
        description: "Ação do Terraform"
        required: true
        type: choice
        default: "plan"
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: terraform-infra
  cancel-in-progress: false

env:
  TF_VERSION: "1.9.8"
  TF_WORKING_DIR: tech-challenge-backend/infra
  AWS_REGION: us-east-1

jobs:
  # JOB 1: PLAN — roda em PR que mexe em terraform/ ou k8s/, ou via dispatch manual
  plan:
    name: Terraform Plan
    # Roda em PR e em push na main (paths terraform/k8s), ou via dispatch manual para plan/apply/destroy.
    # O job apply/destroy usa needs: plan, então o plan precisa rodar também no push para não pular o apply.
    if: github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.action == 'plan' || inputs.action == 'apply' || inputs.action == 'destroy'))
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    env:
      TF_VAR_db_user: ${{ secrets.TF_VAR_DB_USER }}
      TF_VAR_db_pass: ${{ secrets.TF_VAR_DB_PASS }}
      TF_VAR_jwt_secret: ${{ secrets.TF_VAR_JWT_SECRET }}
      TF_VAR_mail_username: ${{ secrets.TF_VAR_MAIL_USERNAME }}
      TF_VAR_mail_password: ${{ secrets.TF_VAR_MAIL_PASSWORD }}

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform plan -input=false -no-color -out=tfplan
        continue-on-error: true

      - name: Publicar Plan no PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN: "${{ steps.plan.outputs.stdout }}${{ steps.plan.outputs.stderr }}"
        with:
          script: |
            const output = `#### Terraform Plan 📖
            \`\`\`
            ${process.env.PLAN}
            \`\`\`
            `;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Falhar se o Plan deu erro
        if: steps.plan.outcome == 'failure'
        run: exit 1

  # JOB 2: APPLY — via push na main (com alteração em terraform/k8s) ou dispatch manual (action=apply); só roda se o Plan tiver sucesso
  apply:
    name: Terraform Apply
    needs: plan
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
    runs-on: ubuntu-latest
    environment: production

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    env:
      TF_VAR_db_user: ${{ secrets.TF_VAR_DB_USER }}
      TF_VAR_db_pass: ${{ secrets.TF_VAR_DB_PASS }}
      TF_VAR_jwt_secret: ${{ secrets.TF_VAR_JWT_SECRET }}
      TF_VAR_mail_username: ${{ secrets.TF_VAR_MAIL_USERNAME }}
      TF_VAR_mail_password: ${{ secrets.TF_VAR_MAIL_PASSWORD }}

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve

      - name: Mostrar Outputs (cluster, ECR, etc.)
        run: terraform output

  # JOB 3: DESTROY — só via dispatch manual, escolhendo action=destroy; só roda se o Plan tiver sucesso
  destroy:
    name: Terraform Destroy
    needs: plan
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
    runs-on: ubuntu-latest
    environment: production

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    env:
      TF_VAR_db_user: ${{ secrets.TF_VAR_DB_USER }}
      TF_VAR_db_pass: ${{ secrets.TF_VAR_DB_PASS }}
      TF_VAR_jwt_secret: ${{ secrets.TF_VAR_JWT_SECRET }}
      TF_VAR_mail_username: ${{ secrets.TF_VAR_MAIL_USERNAME }}
      TF_VAR_mail_password: ${{ secrets.TF_VAR_MAIL_PASSWORD }}

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Destroy
        run: terraform destroy -input=false -auto-approve