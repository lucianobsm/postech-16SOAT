# Especifico do EKS (provisioner ebs.csi.aws.com) - aplicado so pelo Terraform.
# Nao faz parte do kustomization.yaml para nao quebrar `kubectl apply -k` no Kind.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
parameters:
  type: gp3
